# Stdlib unittest. Python 3.10 is the floor.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unittest
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -v
